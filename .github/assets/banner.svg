<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity=".16"/>
      <stop offset="45%" stop-color="#EA580C" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="64%" r="60%">
      <stop offset="0%" stop-color="#FFE9B0"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6DE"/>
      <stop offset="55%" stop-color="#FFDFA6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" rx="16" fill="#0a0908"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- drifting embers -->
  <g fill="#F59E0B">
    <circle cx="176" cy="212" r="2.1" opacity=".55"/>
    <circle cx="236" cy="126" r="1.4" opacity=".30"/>
    <circle cx="305" cy="176" r="1.8" opacity=".42"/>
    <circle cx="118" cy="86"  r="1.2" opacity=".22"/>
    <circle cx="898" cy="196" r="2.0" opacity=".50"/>
    <circle cx="962" cy="112" r="1.4" opacity=".28"/>
    <circle cx="1042" cy="168" r="1.7" opacity=".40"/>
    <circle cx="1096" cy="84" r="1.1" opacity=".20"/>
    <circle cx="560" cy="52"  r="1.3" opacity=".25"/>
    <circle cx="668" cy="44"  r="1.6" opacity=".33"/>
  </g>

  <!-- campfire mark — asymmetric wind-blown tongues over crossed logs -->
  <g transform="translate(600,72)">
    <ellipse cx="0" cy="4" rx="26" ry="20" fill="#F59E0B" opacity=".18" filter="url(#soft)"/>
    <!-- outer flame -->
    <path fill="url(#flame)" d="M -16 10
      C -17 3, -15 -4, -13 -11
      C -11 -7, -9 -6, -7 -9
      C -7 -19, -4 -27, 1 -34
      C 0 -26, 3 -22, 6 -17
      C 8 -15, 10 -17, 11 -20
      C 14 -13, 16 -5, 15 3
      C 14 12, 8 17, 0 17
      C -8 17, -14 15, -16 10 Z"/>
    <!-- inner flame -->
    <path fill="#FFDFA6" opacity=".9" d="M -7 8
      C -8 3, -7 -2, -4 -7
      C -3 -4, -2 -3, 0 -5
      C 1 -10, 3 -13, 5 -16
      C 5 -10, 7 -6, 8 -1
      C 9 6, 6 12, 0 12
      C -4 12, -6 11, -7 8 Z"/>
    <ellipse cx="0" cy="7" rx="4.5" ry="4" fill="#FFF6DE" opacity=".95"/>
    <!-- crossed logs -->
    <g>
      <rect x="-23" y="15" width="46" height="6.5" rx="3.2" fill="#55351b" transform="rotate(9)"/>
      <rect x="-23" y="15" width="46" height="6.5" rx="3.2" fill="#6b4423" transform="rotate(-9)"/>
    </g>
    <!-- rising sparks -->
    <circle cx="-12" cy="-24" r="1.6" fill="#FB923C" opacity=".7"/>
    <circle cx="9"  cy="-32" r="1.2" fill="#F59E0B" opacity=".5"/>
    <circle cx="16" cy="-25" r="1.0" fill="#FFE9B0" opacity=".35"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="172" text-anchor="middle" font-size="64" font-weight="700"
        letter-spacing="30" fill="url(#word)">EMBER</text>

  <rect x="400" y="196" width="400" height="1.5" fill="url(#rule)"/>

  <text x="600" y="228" text-anchor="middle" font-size="15" letter-spacing="7"
        fill="#b8ae9e">THE OFFLINE SURVIVAL CONSOLE</text>

  <text x="600" y="262" text-anchor="middle" font-size="12" letter-spacing="2.5"
        fill="#7c7360">NO INTERNET · NO CLOUD · NO GRID — ONE LAPTOP, SOLAR POWER, EVERYTHING ON-DEVICE</text>
</svg>
