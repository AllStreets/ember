<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060b18">
  <title>EMBER — Offline Survival Console</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot"><div class="boot-mark">EMBER</div><div class="boot-sub">lighting the console…</div></div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="sb-brand">
      <span class="sb-flame" aria-hidden="true"></span>
      <div class="sb-brand-txt"><b>EMBER</b><small>offline console</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sb-foot">
      <div id="llm-chip" class="chip" title="Local LLM status"><span class="dot"></span><span id="llm-chip-txt">LLM —</span></div>
      <div id="store-chip" class="chip" title="Local storage used"><span id="store-chip-txt">— used</span></div>
      <div class="sb-clock" id="clock">--:--:--</div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="view-title">Home</h1>
      <div class="tb-spacer"></div>
      <div id="offline-badge" class="ob"><span class="ob-dot"></span>OFFLINE-READY</div>
    </header>
    <section id="view"></section>
  </main>
</div>

<!-- data (bundled — no network needed) -->
<script src="data/kb.js"></script>
<script src="data/ref.js"></script>
<script src="data/guide.js"></script>
<!-- core -->
<script src="js/store.js"></script>
<script src="js/llm.js"></script>
<!-- modules (sidebar order = load order) -->
<script src="js/home.js"></script>
<script src="js/advisor.js"></script>
<script src="js/survival.js"></script>
<script src="js/fieldguide.js"></script>
<script src="js/navigate.js"></script>
<script src="js/tools.js"></script>
<script src="js/reference.js"></script>
<script src="js/log.js"></script>
<script src="js/power.js"></script>
<script src="js/forge.js"></script>
<!-- shell (loads last) -->
<script src="js/app.js"></script>
</body>
</html>
